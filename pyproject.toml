[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ab-sample-size-cli"
version = "0.1.0"
description = "A/B 实验样本量估算 CLI 工具"
requires-python = ">=3.8"
dependencies = [
  "scipy>=1.7.0",
  "click>=8.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
]

[project.scripts]
ab-sample = "sample_size_cli.main:main"
